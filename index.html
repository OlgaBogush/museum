<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">

      </div>
      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-link">Visiting</li>
          <li class="nav-link">Explore</li>
          <li class="nav-link">Video</li>

          <li class="nav-link">Tickets</li>
          <li class="nav-link">Contacts</li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <section class="welcome">
      <div class="container welcome-container">

          <h1>Welcome <br> to the Louvre</h1>

          <a class="welcome-button" href="#">Discover the Louvre</a>

    <section class="visiting">

      </div>
